# =====================================================
# AI安全事件库 — 主配置文件
# 优先级: application-{profile}.yml > application.yml
# 本地开发: spring.profiles.active=dev（默认）
# 正式部署: spring.profiles.active=prod（见 application-prod.yml）
# =====================================================

server:
  # 服务端口 (8080 为默认，如冲突可改为 8888)
  port: 8080
  servlet:
    # 统一路径前缀，所有接口以 /api 开头
    context-path: /api

spring:
  # 默认激活 dev 环境配置
  profiles:
    active: dev

  servlet:
    multipart:
      # 与 ClueReportFileStorage 一致：单文件/ZIP 最大 200MB，整次请求留余量
      max-file-size: 200MB
      max-request-size: 220MB

  # Jackson 全局日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ---- MyBatis Plus 配置 ----
mybatis-plus:
  # 全局配置
  global-config:
    # 数据库字段命名策略: java采用驼峰，数据库采用下划线 (自动映射)
    db-config:
      # 逻辑删除标记名 (对应数据库 del_flag 字段)
      logic-delete-field: delFlag
      logic-delete-value: "1"    # 已删除
      logic-not-delete-value: "0" # 未删除
  # 实体类包路径 (用于 TypeAlias)
  type-aliases-package: com.aisafe.**.entity
  # SQL 日志由各 profile 配置（dev 开启，prod 关闭）

# ---- Sa-Token 配置 ----
sa-token:
  # Token 名称 (前端请求头: Authorization: Bearer xxx)
  token-name: Authorization
  # Token 前缀
  token-prefix: Bearer
  # Token 有效期: 2小时 (单位: 秒)
  timeout: 7200
  # 是否允许同一账号多地同时登录 (true=允许, false=互踢)
  is-concurrent: true
  # Token 风格: 从请求头读取
  is-read-header: true
  # JWT 密钥由 dev/prod profile 覆盖（生产请用环境变量 AISAFE_JWT_SECRET）

# ---- 平台文件路径（由 dev/prod profile 覆盖） ----
