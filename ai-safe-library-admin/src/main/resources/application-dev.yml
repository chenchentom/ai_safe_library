# =====================================================
# AI安全事件库 — 开发环境配置
# 激活方式: spring.profiles.active=dev (在 application.yml 中已默认)
# =====================================================

spring:
  # ---- MySQL 数据源 ----
  datasource:
    # 驱动类 (MySQL 8+ 使用 com.mysql.cj.jdbc.Driver)
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接地址: 时区 UTC+8、字符集 utf8mb4、允许公钥检索
    url: jdbc:mysql://localhost:3306/ai_safe_library?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    # HikariCP 连接池配置
    hikari:
      # 连接池最大连接数
      maximum-pool-size: 20
      # 最小空闲连接数
      minimum-idle: 5
      # 连接超时时间: 30秒
      connection-timeout: 30000
      # 空闲连接最大存活时间: 10分钟
      idle-timeout: 600000

  # ---- Redis 缓存 ----
  data:
    redis:
      host: localhost
      port: 6379
      # 本地开发无密码
      password:
      # 连接池
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ---- Elasticsearch ----
  elasticsearch:
    # REST 客户端地址
    uris: https://localhost:9200
    # 认证信息
    username: elastic
    password: V4h_Am00B-eNpeE5OSf*
    # 连接超时
    connection-timeout: 10s
    socket-timeout: 30s

# ---- 本地文件路径（部署时可按环境修改） ----
aisafe:
  file:
    base-dir: /Volumes/mac/code/java/ai_safe_library/ai-file
    risk-report-template-path: /Volumes/mac/code/java/ai_safe_library/ai-file/数据模版.xlsx

# ---- 开发环境专属日志 ----
logging:
  level:
    # 框架包 debug 级别 (显示请求映射、参数绑定等)
    com.aisafe: debug
    # MyBatis SQL 日志
    com.aisafe.system.mapper: debug
